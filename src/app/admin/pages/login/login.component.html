<main class="login-container">
  <div class="login-wrapper">
    <mat-card class="login-card glass">
      <mat-card-header>
        <img src="/logo.png" alt="" class="login-logo" width="40" height="40" />
        <mat-card-title>
          Área Administrativa
        </mat-card-title>
        <mat-card-subtitle>Luderia Digital - Painel de Controle</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <input matInput formControlName="email" type="email" placeholder="admin@luderia.com" autocomplete="username" />
            <lucide-icon matSuffix name="mail" />
            <mat-error>{{ getErrorMessage('email') }}</mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Senha</mat-label>
            <input
              matInput
              formControlName="password"
              [type]="hidePassword() ? 'password' : 'text'"
              placeholder="Digite sua senha"
              autocomplete="current-password"
            />
            <button
              mat-icon-button
              matSuffix
              type="button"
              [attr.aria-label]="hidePassword() ? 'Mostrar senha' : 'Ocultar senha'"
              [attr.aria-pressed]="!hidePassword()"
              (click)="hidePassword.set(!hidePassword())"
            >
              <lucide-icon [name]="hidePassword() ? 'eye-off' : 'eye'" />
            </button>
            <mat-error>{{ getErrorMessage('password') }}</mat-error>
          </mat-form-field>
        </form>
      </mat-card-content>

      <mat-card-actions>
        <button
          mat-raised-button
          class="btn-block btn-lg login-button"
          (click)="onSubmit()"
          [disabled]="loading()"
        >
          @if (loading()) {
            <lucide-icon class="spin" name="loader-circle" />
            Entrando...
          } @else {
            <lucide-icon name="log-in" />
            Entrar
          }
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</main>

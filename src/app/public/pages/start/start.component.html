<main class="start-container">
  <mat-card class="start-card glass">
    <mat-card-header>
      <mat-card-title>
        <img src="assets/AngatuLogo.png" alt="" class="logo-icon" width="48" height="48" />
        Angatu Jogos
      </mat-card-title>
      <mat-card-subtitle>Informe seu nome e celular para acessar sua comanda</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()" id="acesso-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Seu nome</mat-label>
          <input matInput formControlName="nomeCliente" placeholder="Digite seu nome" autocomplete="name" />
          <lucide-icon matSuffix name="user" />
          <mat-error>{{ getErrorMessage('nomeCliente') }}</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Celular</mat-label>
          <input matInput formControlName="celular" placeholder="11987654321" type="tel" inputmode="tel" autocomplete="tel-national" />
          <lucide-icon matSuffix name="phone" />
          <mat-error>{{ getErrorMessage('celular') }}</mat-error>
        </mat-form-field>
      </form>
    </mat-card-content>

    <mat-card-actions class="start-actions">
      <button mat-raised-button type="submit" form="acesso-form" class="btn-block btn-lg start-button" [disabled]="loading()">
        @if (loading()) {
          <lucide-icon class="spin" name="loader-circle" />
          Acessando...
        } @else {
          <lucide-icon name="arrow-right" />
          Acessar Comanda
        }
      </button>

      <p class="start-hint">Se já houver uma comanda aberta para este celular, ela será recuperada.</p>
    </mat-card-actions>
  </mat-card>
</main>
